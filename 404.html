<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · 50 Champs</title>
<link rel="icon" href="/icon-192.png">
<style>
  :root { --bg:#0f1115; --panel:#171a20; --line:#2a2f37; --text:#e6e9ee; --muted:#9aa1ac; --accent:#97aacc; --on-accent:#0f1115; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f5f7; --panel:#fff; --line:#dde1e6; --text:#1d232b; --muted:#5b6472; --accent:#2f54a0; --on-accent:#fff; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; text-align: center; }
  .code { font-size: 52px; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
  h1 { font-size: 18px; margin: 10px 0 6px; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  a { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 11px; font-weight: 700; font-size: 14px; text-decoration: none; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .ghost { border: 1px solid var(--line); color: var(--text); }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be old. Your clan data is safe.</p>
    <div class="row">
      <a class="primary" href="/dashboard.html">Open dashboard</a>
      <a class="ghost" href="/">Home</a>
    </div>
  </div>
</main>
</body>
</html>
